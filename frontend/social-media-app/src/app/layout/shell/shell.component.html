<mat-sidenav-container class="shell">
  <mat-sidenav mode="side" opened class="sidebar">
    <div class="brand-block">
      <div class="logo-mark">SH</div>
      <div>
        <div class="brand-name">Social Hub</div>
        <div class="brand-tag">Integration Studio</div>
      </div>
    </div>

    <mat-nav-list>
      @for (item of menus; track item.link) {
        <a mat-list-item [routerLink]="item.link" routerLinkActive="active">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="topbar">
      <span class="spacer"></span>
      <span class="user-chip">{{ auth.currentUser()?.fullName || 'User' }}</span>
      <button mat-button (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
