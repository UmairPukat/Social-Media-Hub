<div class="page">
  <div class="page-header">
    <h1>Analytics</h1>
    <p>High-level performance overview across connected social channels.</p>
  </div>

  <div class="grid-cards">
    @for (m of metrics; track m.label) {
      <article class="platform-card">
        <h3>{{ m.label }}</h3>
        <div class="value">{{ m.value }}</div>
        <p>{{ m.hint }}</p>
      </article>
    }
  </div>
</div>
