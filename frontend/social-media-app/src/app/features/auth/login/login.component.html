<div class="auth-shell">
  <div class="auth-card">
    <p class="brand">Social Hub</p>
    <p class="subtitle">Sign in to manage all your social channels in one place.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
      </mat-form-field>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button mat-flat-button color="primary" class="full-width" [disabled]="loading()">
        @if (loading()) {
          <mat-spinner diameter="20"></mat-spinner>
        } @else {
          Sign in
        }
      </button>
    </form>

    <p class="hint mt-16">
      Need an account? Ask an admin for a signup access token, then register from
      <strong>App → Invite Signup</strong> after signing in, or contact your team lead.
    </p>
  </div>
</div>
