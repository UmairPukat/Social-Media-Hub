<div class="page">
  <div class="page-header">
    <h1>Invite Signup</h1>
    <p>Create a new user account using a valid access token.</p>
  </div>

  <div class="signup-panel">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Full name</mat-label>
        <input matInput formControlName="fullName" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Access token</mat-label>
        <input matInput formControlName="accessToken" placeholder="SMI-DEMO-ACCESS-2026" />
      </mat-form-field>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button mat-flat-button color="primary" [disabled]="loading()">Create account</button>
    </form>
  </div>
</div>
