<div class="page">
  <div class="page-header">
    <h1>Settings</h1>
    <p>Workspace preferences for notifications and moderation.</p>
  </div>

  <div class="settings-panel">
    <div class="row">
      <div>
        <strong>Email alerts</strong>
        <p>Notify me when new inbox items arrive.</p>
      </div>
      <mat-slide-toggle [(ngModel)]="emailAlerts"></mat-slide-toggle>
    </div>
    <div class="row">
      <div>
        <strong>Auto-hide spam comments</strong>
        <p>Automatically hide comments flagged as spam (when available).</p>
      </div>
      <mat-slide-toggle [(ngModel)]="autoHideSpam"></mat-slide-toggle>
    </div>
  </div>
</div>
