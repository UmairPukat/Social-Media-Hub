<div class="page">
  <div class="page-header">
    <h1>Connected Accounts</h1>
    <p>Accounts currently linked to your Social Hub workspace.</p>
  </div>

  <div class="grid-cards">
    @for (account of accounts(); track account.platform) {
      <article class="platform-card">
        <h3>{{ account.name }}</h3>
        <p>{{ account.accountName || 'Connected account' }}</p>
        <span class="badge">Connected</span>
      </article>
    } @empty {
      <div class="empty">
        No connected accounts yet.
        <a mat-button color="primary" routerLink="/app/integrations">Go to Integrations</a>
      </div>
    }
  </div>
</div>
